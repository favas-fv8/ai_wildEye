{% extends 'myapp/admin_base.html' %}
{% load static %}
{% block title %}{{ title }} - Ai-WildEye{% endblock %}

{% block body %}
<div class="container fade-in" style="max-width: 700px;">
  <div class="card card-raised mb-4">
    <div class="card-body">
      <div class="page-header" style="margin-bottom:0;">
        <h2>{{ title }}</h2>
      </div>
    </div>
  </div>

  <div class="card card-raised">
    <div class="card-body">
      <form method="post" action="{% url 'admin_pic_pool_add' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="document">Select Image File</label>
          <input class="form-control-file" type="file" name="document" id="document" accept="image/*" required>
        </div>
        <div class="form-group mt-5">
          <button type="submit" class="btn btn-primary">Upload & Analyze</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>

  {% if msg %}
  <div class="analysis-result">
    <div class="alert alert-card alert-dismissible mt-5" role="alert">
      <div class="alert-content">{{ msg }}</div>
      <button type="button" class="alert-close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    {% if pic_path %}
    <div class="card card-raised mt-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Analyzed Image</h5>
        <img src="../static/myapp/media/{{ pic_path }}" class="media-thumb media-thumb-lg" alt="Analyzed Image">
      </div>
    </div>
    {% endif %}
  </div>
  {% endif %}
</div>
{% endblock %}
