{% extends 'myapp/staff_base.html' %}
{% load static %}
{% block title %}Change Password - Ai-WildEye{% endblock %}

{% block body %}
<div class="container fade-in" style="max-width: 500px;">
  <div class="page-header">
    <h2>Change Password</h2>
  </div>

  {% if msg %}
  <div class="alert alert-info alert-dismissible" role="alert">
    <div class="alert-content">{{ msg }}</div>
    <button type="button" class="alert-close" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  {% endif %}

  <div class="card card-raised">
    <div class="card-body">
      <form method="post" action="{% url 'staff_changepassword' %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <input class="form-control" type="password" id="current_password" name="current_password" placeholder="Enter current password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input class="form-control" type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
        </div>
        <div class="form-group mt-5">
          <button type="submit" class="btn btn-primary">Update Password</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
