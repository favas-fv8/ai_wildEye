{% extends 'myapp/admin_base.html' %}
{% load static %}
{% block title %}Add Email - Ai-WildEye{% endblock %}

{% block body %}
<div class="container fade-in" style="max-width: 600px;">
  <div class="page-header">
    <h2>Add Email Address</h2>
  </div>

  {% if msg %}
  <div class="alert alert-success alert-dismissible" role="alert">
    <div class="alert-content">{{ msg }}</div>
    <button type="button" class="alert-close" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  {% endif %}

  <div class="card card-raised">
    <div class="card-body">
      <form method="post" action="{% url 'admin_category_settings_add' %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="category_name">Email Address</label>
          <input class="form-control" type="email" name="category_name" id="category_name" placeholder="Enter email address" required>
        </div>
        <div class="form-group mt-5">
          <button type="submit" class="btn btn-primary">Add Email</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
