{% extends 'myapp/admin_base.html' %}
{% load static %}
{% block title %}Camera Capture - Ai-WildEye{% endblock %}

{% block body %}
<div class="container fade-in" style="max-width: 900px;">
  <div class="page-header">
    <h2>IP Camera - Admin</h2>
  </div>

  {% if msg %}
  <div class="alert alert-info alert-dismissible" role="alert">
    <div class="alert-content">{{ msg }}</div>
    <button type="button" class="alert-close" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  {% endif %}

  <div class="card card-raised">
    <div class="card-body">
      <div class="row">
        <div class="col col-md-8">
          <div class="live-stream-wrapper">
            <span class="live-stream-badge">Live</span>
            <img id="live-stream" src="{{ video_url }}" alt="Live Camera Stream">
          </div>
        </div>
        <div class="col col-md-4">
          <div id="status" class="mb-3" style="min-height: 40px;">
            <p class="text-muted">Click capture to analyze a frame</p>
          </div>
          <div id="last-capture"></div>
          <form id="capture-form" method="post" class="mt-3">
            {% csrf_token %}
            <button type="button" class="btn btn-primary w-100 no-loading" id="capture-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              Capture & Analyze
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const captureBtn = document.getElementById("capture-btn");
    const statusDiv = document.getElementById("status");
    const lastCaptureDiv = document.getElementById("last-capture");
    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    captureBtn.addEventListener("click", function () {
        statusDiv.innerHTML = '<div class="d-flex align-items-center gap-2"><span class="spinner"></span> <span>Capturing and analyzing...</span></div>';
        lastCaptureDiv.innerHTML = '';

        fetch("{% url 'save_frame' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": csrftoken,
                "X-Requested-With": "XMLHttpRequest",
            },
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                statusDiv.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
                lastCaptureDiv.innerHTML = '<img src="../static/myapp' + data.file_url + '" class="media-thumb-lg" style="max-width:100%; border-radius: 8px;" alt="Captured frame">';
            } else {
                statusDiv.innerHTML = '<div class="alert alert-danger">Error: ' + (data.message || "Unknown error") + '</div>';
            }
        })
        .catch(err => {
            console.error(err);
            statusDiv.innerHTML = '<div class="alert alert-danger">Request failed.</div>';
        });
    });
});
</script>
{% endblock %}
