{% extends 'myapp/user_base.html' %}
{% load static %}
{% block background %}{% endblock %}
{% block body %}
<center>

    <h2><font color="#366092">Test History View</font></h2>
    <div class="container">
    <form name="frm" action="" method="post">
            {% csrf_token %}
         <table class="table table-striped table-bordered">
            <thead>
        <tr>
            <th>ID</th>
            <th>Picture</th>
            <th>Result</th>
            <th>Date/Time</th>
            <!-- <th>Action</th> -->
        </tr>
            </thead>
             <tbody>
        {% for p in test_list %}
        <tr class="info ">
            <td>{{ p.id }}</td>
            <td><img src="../static/myapp/media/{{p.pic_path }}" width="100" height="100"></td>
            <td>{{p.status}}</td>
            <td>{{p.dt}}/{{p.tm}}</td>
            <!-- <td><a class="btn btn-danger" href="../admin_pic_pool_delete?id={{p.id}}">Delete</a></td> -->
        </tr>
        {% endfor %}
             </tbody>
        </table>
        <br/>
        <!-- <a class="btn btn-info" href="{% url 'admin_pic_pool_add' %}">Add Picture</a> -->
        <br><br>
    </form>
    {{msg}}
    </div>
</center>
{% endblock %}
